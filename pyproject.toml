[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scm-forecast"
version = "0.1.0"
description = "Demand forecasting and inventory policy analytics on synthetic 50-SKU data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy", "pandas", "scipy", "statsmodels", "scikit-learn",
  "lightgbm", "matplotlib", "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
